<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cuerpo-app">
    <h1 class="titulo-principal">Gestor de Biblioteca</h1>
    <p class="subtitulo">Administración del catálogo usando nuestra propia API REST.</p>

    <hr>

    <section class="tarjeta-seccion">
        <h2 class="titulo-seccion">Gestión de Autores</h2>
        
        <form id="form-autor" class="formulario-crud">
            <input type="hidden" id="autor-id">
            
            <input type="text" id="autor-nombre" class="campo-entrada" placeholder="Nombre del autor" required>
            <input type="text" id="autor-nacionalidad" class="campo-entrada" placeholder="Nacionalidad" required>
            
            <button type="submit" class="boton-guardar">Guardar Autor</button>
        </form>

        <br>

        <table class="tabla-datos">
            <thead class="cabecera-tabla">
                <tr>
                    <th class="celda-cabecera">ID</th>
                    <th class="celda-cabecera">Nombre</th>
                    <th class="celda-cabecera">Nacionalidad</th>
                    <th class="celda-cabecera">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-autores">
                </tbody>
        </table>
    </section>

    <br><br><hr><br>

    <section class="tarjeta-seccion">
        <h2 class="titulo-seccion">Gestión de Libros</h2>
        
        <form id="form-libro" class="formulario-crud">
            <input type="hidden" id="libro-id">
            
            <input type="text" id="libro-titulo" class="campo-entrada" placeholder="Título del libro" required>
            <input type="number" id="libro-anio" class="campo-entrada" placeholder="Año de publicación" required>
            
            <select id="libro-autor_id" class="campo-entrada" required>
                <option value="">Selecciona un autor...</option>
                </select>
            
            <button type="submit" class="boton-guardar">Guardar Libro</button>
        </form>

        <br>

        <table class="tabla-datos">
            <thead class="cabecera-tabla">
                <tr>
                    <th class="celda-cabecera">ID</th>
                    <th class="celda-cabecera">Título</th>
                    <th class="celda-cabecera">Año</th>
                    <th class="celda-cabecera">ID Autor</th>
                    <th class="celda-cabecera">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-libros">
                </tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
